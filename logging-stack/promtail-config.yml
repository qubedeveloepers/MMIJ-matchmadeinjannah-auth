server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # PM2 application logs (JSON format from Pino)
  - job_name: nestjs-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: nestjs-matchmadeinjannah
          app: auth-service
          __path__: /pm2-logs/mmij-out.log
    pipeline_stages:
      # Parse JSON logs from Pino
      - json:
          expressions:
            level: level
            time: time
            msg: msg
            req: req
            res: res
            err: err
            userId: userId
            email: email
      # Map Pino log levels to labels
      - labels:
          level:

  # PM2 error logs
  - job_name: nestjs-app-errors
    static_configs:
      - targets:
          - localhost
        labels:
          job: nestjs-matchmadeinjannah
          app: auth-service
          stream: stderr
          __path__: /pm2-logs/mmij-error.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            time: time
            msg: msg
            err: err
      - labels:
          level:
